[build-system]
requires = ["setuptools>=68"]
build-backend = "setuptools.build_meta"

[project]
name = "mini_amigo"
version = "0.1.0"
description = "Python port of the minimal AMIGO costMex runner (basic_amigo)"
requires-python = ">=3.10"
dependencies = ["numpy"]

[project.optional-dependencies]
test = ["pytest"]

[tool.setuptools]
packages = ["mini_amigo"]

[tool.pytest.ini_options]
testpaths = ["tests"]
